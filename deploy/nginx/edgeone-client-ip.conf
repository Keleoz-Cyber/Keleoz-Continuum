# HTTP-context include. The secret map must be installed root-only, outside Git.
map $http_x_continuum_origin_key $continuum_eo_verified {
    default 0;
    include /etc/nginx/continuum-secrets/edgeone-key.map;
}
# Nginx geo maps malformed addresses to 255.255.255.255. Reject its reserved block
# (that sentinel cannot itself be used as a CIDR declaration in Nginx).
# This validates addresses; it does NOT establish trusted proxy networks.
geo $http_eo_connecting_ip $continuum_eo_ip_valid {
    default 1;
    255.255.255.0/24 0;
}
map "$continuum_eo_verified:$continuum_eo_ip_valid" $continuum_client_ip {
    default $remote_addr;
    "1:1" $http_eo_connecting_ip;
}
log_format continuum_edge escape=json
    '{"client":"$continuum_client_ip","peer":"$remote_addr",'
    '"edge_verified":$continuum_eo_verified,"edge_ip_valid":$continuum_eo_ip_valid,'
    '"request":"$request","status":$status,"bytes":$body_bytes_sent,'
    '"agent":"$http_user_agent"}';
