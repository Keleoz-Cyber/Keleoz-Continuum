# Existing host TLS and Certbot paths, verified on keleoz-tencent.
server {
    listen 80;
    listen [::]:80;
    server_name keleoz.com www.keleoz.com;
    return 308 https://keleoz.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.keleoz.com;
    ssl_certificate /etc/letsencrypt/live/keleoz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/keleoz.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 308 https://keleoz.com$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name keleoz.com;
    ssl_certificate /etc/letsencrypt/live/keleoz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/keleoz.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;
    client_max_body_size 28m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        # This is the internet-facing trusted boundary: discard client-supplied IP headers.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 130s;
        proxy_read_timeout 130s;
    }
}
