# Existing host TLS and Certbot paths, verified on keleoz-tencent.
# Install the includes and root-only origin key before reloading this config.
include /etc/nginx/snippets/continuum-edgeone-client-ip.conf;
map $http_accept_encoding $continuum_font_css {
    default source.css;
    "~*(^|,)\s*br\s*(,|$)" source.css.br;
    "~*(^|,)\s*gzip\s*(,|$)" source.css.gz;
}
map $continuum_font_css $continuum_font_encoding {
    default "";
    source.css.br br;
    source.css.gz gzip;
}
server {
    listen 80;
    listen [::]:80;
    server_name keleoz.com www.keleoz.com;
    return 308 https://keleoz.com$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.keleoz.com;
    ssl_certificate /etc/letsencrypt/live/keleoz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/keleoz.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 308 https://keleoz.com$request_uri;
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name keleoz.com;
    access_log /var/log/nginx/keleoz-access.log continuum_edge;
    ssl_certificate /etc/letsencrypt/live/keleoz.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/keleoz.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;
    client_max_body_size 28m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    # Public delivery assets only, copied separately; no access to application secrets.
    location = /fonts/source.css {
        gzip off;
        root /var/www/keleoz-static;
        types { }
        default_type text/css;
        try_files /fonts/$continuum_font_css =404;
        add_header Content-Encoding $continuum_font_encoding;
        add_header Vary Accept-Encoding always;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
    }
    # Compatibility for the rejected WebP trial; original PNG remains authoritative.
    location = /optimized/bg-canvas-0d5b4b50d0b16aa8.webp {
        add_header Cache-Control no-store;
        return 302 /reference/internal-beyond/bg-canvas.png;
    }
    location ~ "^/fonts/[a-f0-9]{64}\.woff2$" {
        root /var/www/keleoz-static;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        include /etc/nginx/snippets/continuum-edgeone-proxy-headers.conf;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 130s;
        proxy_read_timeout 130s;
    }
}
