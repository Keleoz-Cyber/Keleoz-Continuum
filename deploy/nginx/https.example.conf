# Optional direct TLS for keleoz.com; compose.https.yml mounts existing PEM files.
# Certificate paths below are container paths, not assumptions about the server layout.
upstream continuum_app {
  server app:3000;
  keepalive 16;
}

server {
  listen 80;
  server_name keleoz.com;
  location / { return 308 https://keleoz.com$request_uri; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name keleoz.com;
  server_tokens off;

  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_session_cache shared:TLS:10m;
  ssl_session_timeout 1d;
  ssl_protocols TLSv1.2 TLSv1.3;

  client_max_body_size 28m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;

  location = /healthz {
    proxy_pass http://continuum_app/api/health;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    access_log off;
  }

  location / {
    proxy_pass http://continuum_app;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_send_timeout 130s;
    proxy_read_timeout 130s;
  }
}
