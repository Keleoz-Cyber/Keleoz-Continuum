name: keleoz-continuum

x-app-environment: &app-environment
  NODE_ENV: production
  DATABASE_URL: postgresql://continuum:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/continuum
  SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
  SITE_ORIGIN: ${SITE_ORIGIN:?Set SITE_ORIGIN}
  MEDIA_DRIVER: ${MEDIA_DRIVER:-local}
  MEDIA_LOCAL_ROOT: /app/var/media
  MEDIA_LIGHTCOS_BUCKET: ${MEDIA_LIGHTCOS_BUCKET:-}
  MEDIA_LIGHTCOS_SECRET_ID: ${MEDIA_LIGHTCOS_SECRET_ID:-}
  MEDIA_LIGHTCOS_SECRET_KEY: ${MEDIA_LIGHTCOS_SECRET_KEY:-}
  MEDIA_PUBLIC_ORIGIN: ${MEDIA_PUBLIC_ORIGIN:-}
  CONTINUUM_BACKUP_ROOT: /app/var/backups
  CONTINUUM_BACKUP_MODE: direct
  AI_GATEWAY_ENABLED: ${AI_GATEWAY_ENABLED:-false}
  AI_BASE_URL: ${AI_BASE_URL:-}
  AI_API_KEY: ${AI_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-}
  AI_COMPANION_NAME: ${AI_COMPANION_NAME:-Keleoz}
  # Output limits include provider-default thinking; do not disable reasoning.
  AI_TEA_MAX_OUTPUT_TOKENS: ${AI_TEA_MAX_OUTPUT_TOKENS:-2048}
  AI_TEA_MAX_REQUESTS_PER_SESSION: ${AI_TEA_MAX_REQUESTS_PER_SESSION:-12}
  AI_TEA_MAX_REQUESTS_PER_SOURCE_DAY: ${AI_TEA_MAX_REQUESTS_PER_SOURCE_DAY:-20}
  AI_TEA_COOLDOWN_SECONDS: ${AI_TEA_COOLDOWN_SECONDS:-3}
  AI_STORY_MAX_OUTPUT_TOKENS: ${AI_STORY_MAX_OUTPUT_TOKENS:-4096}
  AI_STORY_DOCUMENT_MAX_OUTPUT_TOKENS: ${AI_STORY_DOCUMENT_MAX_OUTPUT_TOKENS:-8192}
  AI_STORY_MAX_REQUESTS_PER_SESSION: ${AI_STORY_MAX_REQUESTS_PER_SESSION:-20}
  AI_STORY_MAX_REQUESTS_PER_SOURCE_DAY: ${AI_STORY_MAX_REQUESTS_PER_SOURCE_DAY:-30}
  AI_STORY_COOLDOWN_SECONDS: ${AI_STORY_COOLDOWN_SECONDS:-1}
  AI_STORY_DOCUMENT_TIMEOUT_MS: ${AI_STORY_DOCUMENT_TIMEOUT_MS:-90000}
  AI_TAROT_MAX_OUTPUT_TOKENS: ${AI_TAROT_MAX_OUTPUT_TOKENS:-2048}
  AI_TAROT_MAX_REQUESTS_PER_SESSION: ${AI_TAROT_MAX_REQUESTS_PER_SESSION:-4}
  AI_TAROT_MAX_REQUESTS_PER_SOURCE_DAY: ${AI_TAROT_MAX_REQUESTS_PER_SOURCE_DAY:-20}
  AI_TAROT_COOLDOWN_SECONDS: ${AI_TAROT_COOLDOWN_SECONDS:-1}
  AI_PERSONA_MAX_OUTPUT_TOKENS: ${AI_PERSONA_MAX_OUTPUT_TOKENS:-2048}
  AI_CHAT_MAX_OUTPUT_TOKENS: ${AI_CHAT_MAX_OUTPUT_TOKENS:-4096}
  AI_CHAT_MAX_REQUESTS_PER_THREAD: ${AI_CHAT_MAX_REQUESTS_PER_THREAD:-200}
  AI_CHAT_MAX_REQUESTS_PER_OWNER_DAY: ${AI_CHAT_MAX_REQUESTS_PER_OWNER_DAY:-500}
  AI_GLOBAL_MAX_CONCURRENCY: ${AI_GLOBAL_MAX_CONCURRENCY:-2}
  AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-90000}
  AI_DAILY_BUDGET_MICRO_USD: ${AI_DAILY_BUDGET_MICRO_USD:-0}
  AI_INPUT_MICRO_USD_PER_MILLION_TOKENS: ${AI_INPUT_MICRO_USD_PER_MILLION_TOKENS:-0}
  AI_OUTPUT_MICRO_USD_PER_MILLION_TOKENS: ${AI_OUTPUT_MICRO_USD_PER_MILLION_TOKENS:-0}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: continuum
      POSTGRES_USER: continuum
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - continuum-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U continuum -d continuum"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 768m
    pids_limit: 128
    shm_size: 128m

  migrate:
    image: keleoz-continuum-tooling:${CONTINUUM_IMAGE_TAG:-local}
    build:
      context: .
      target: tooling
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    cpus: 1.0
    mem_limit: 768m
    pids_limit: 128

  app:
    image: keleoz-continuum-app:${CONTINUUM_IMAGE_TAG:-local}
    build:
      context: .
      target: runner
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    environment: *app-environment
    volumes:
      - continuum-media:/app/var/media
      - continuum-backups:/app/var/backups
      - continuum-next-cache:/app/.next/cache
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 6s
      start_period: 20s
      retries: 3
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cpus: 2.75
    mem_limit: 2300m
    pids_limit: 256

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "${CONTINUUM_HTTP_BIND:-0.0.0.0}:${CONTINUUM_HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m,mode=0755
      - /var/run:size=4m,mode=0755
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 64

  backup:
    profiles: ["maintenance"]
    image: keleoz-continuum-tooling:${CONTINUUM_IMAGE_TAG:-local}
    build:
      context: .
      target: tooling
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    environment: *app-environment
    volumes:
      - continuum-backups:/app/var/backups
      - continuum-media:/app/var/media:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["pnpm", "backup:create"]
    restart: "no"
    cpus: 1.0
    mem_limit: 768m
    pids_limit: 128

volumes:
  continuum-db:
  continuum-media:
  continuum-backups:
  continuum-next-cache:
